name: Deploy getCryptoDomains to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-ghost-ai-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Verify Cloudflare output
        run: |
          test -f dist/server/server.js
          test -d dist/client

      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc12ba22417960e78cd61eb57d04a60c
